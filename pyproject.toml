[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "governedmemory"
version = "0.1.0.dev1"
description = "Governed Memory OSS core — Metaworkers.AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length handled by formatter
