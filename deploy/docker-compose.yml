# Full self-hosted stack: Postgres+pgvector, the REST API, and the web console --
# one command brings up everything a self-hoster needs.
#
# This is cloud-agnostic: the same DATABASE_URL format works on AWS RDS,
# GCP Cloud SQL, Azure Postgres, Supabase, Neon, etc.
# Only this docker-compose file is environment-specific.
#
# Start:   docker compose -f deploy/docker-compose.yml up -d
# Start + seed demo data (one tenant, five customers, 50 memories):
#          docker compose -f deploy/docker-compose.yml --profile seed up -d
# Stop:    docker compose -f deploy/docker-compose.yml down
# Reset:   docker compose -f deploy/docker-compose.yml down -v   (deletes data)
#
# Console:  http://localhost:3000
# API:      http://localhost:8000
#
# GOVERNEDMEMORY_API_KEY (default "demo-key") is the one key the web console
# authenticates with -- it must be one of the tenant:key pairs in
# GOVERNEDMEMORY_API_KEYS below. Override both together if you change either.
# The default tenant ("solstice-cloud") matches scripts/demo_data.py's
# TENANT_ID, so the --profile seed job's data shows up in the console with
# zero extra config -- keep these in sync if either one changes.

name: governedmemory

services:
  postgres:
    image: pgvector/pgvector:pg16          # official image with pgvector pre-installed
    environment:
      POSTGRES_DB: governedmemory
      POSTGRES_USER: mw
      POSTGRES_PASSWORD: mw_dev_password   # override in production via secrets manager
    ports:
      # The Quickstart wrapper selects another free host port when 5432 is busy.
      # Containers still reach Postgres at postgres:5432 on the internal network.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mw -d governedmemory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://mw:mw_dev_password@postgres:5432/governedmemory
      # Override with your own tenant:key pairs — this default is dev-only.
      GOVERNEDMEMORY_API_KEYS: ${GOVERNEDMEMORY_API_KEYS:-solstice-cloud:demo-key}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../web
    environment:
      # "api" resolves via Docker's internal network -- not localhost.
      GOVERNEDMEMORY_API_URL: http://api:8000
      GOVERNEDMEMORY_API_KEY: ${GOVERNEDMEMORY_API_KEY:-demo-key}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Optional one-shot job: populates the demo tenant (scripts/demo_data.py --
  # one company, five customers, 50 memories, mixed trusted/untrusted/
  # quarantined, one purpose-binding policy) so `--profile seed up` gives a
  # cold clone something to look at in the console immediately. Talks
  # directly to Postgres, not through the API, so it only waits on that
  # healthcheck. Reuses the `api` image (already has core/ + scripts/ + deps)
  # rather than building a separate one.
  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://mw:mw_dev_password@postgres:5432/governedmemory
    command: ["python", "scripts/seed_demo.py", "--reset"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["seed"]

volumes:
  pgdata:
    driver: local
