[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metaworkers"
version = "0.1.0.dev1"
description = "Thin Python client for a self-hosted GovernedMemory REST API server"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
]
# Deliberately empty: this client is stdlib-only (urllib.request + json),
# by design -- see metaworkers/client.py's module docstring.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["metaworkers*"]
