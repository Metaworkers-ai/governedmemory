[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metaworkers"
version = "0.1.0"
description = "Thin Python client for a self-hosted GovernedMemory REST API server"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["ai-agents", "memory", "llm-security", "prompt-injection", "rag-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
# Deliberately empty: this client is stdlib-only (urllib.request + json),
# by design -- see metaworkers/client.py's module docstring.
dependencies = []

[project.optional-dependencies]
mem0 = ["mem0ai==2.0.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["metaworkers*"]

[project.urls]
Homepage = "https://demo.metaworkers.ai/"
Documentation = "https://github.com/Metaworkers-ai/governedmemory#readme"
Repository = "https://github.com/Metaworkers-ai/governedmemory"
Issues = "https://github.com/Metaworkers-ai/governedmemory/issues"
