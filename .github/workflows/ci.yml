name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pip install -e sdk/python
      - name: ruff check
        run: ruff check core/ api/ tests/ sdk/python/
      - name: ruff format --check
        run: ruff format --check core/ api/ tests/ sdk/python/

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pip install -e sdk/python
      - name: pytest tests/unit
        run: pytest tests/unit/ -v --cov=core --cov=api --cov=metaworkers --cov-report=term-missing

  test-integration:
    name: Integration tests (Postgres + pgvector via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-api.txt
          pip install -e .
          pip install -e sdk/python
      - name: pytest tests/integration
        run: pytest tests/integration/ -v --cov=core --cov=api --cov=metaworkers --cov-report=term-missing

  test-mem0-contract:
    name: Mem0 OSS contract (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Mem0 extra
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pip install -e "sdk/python[mem0]"
      - name: pytest pinned Mem0 contract
        run: pytest tests/unit/test_mem0_contract.py -v

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: next build
        env:
          GOVERNEDMEMORY_API_URL: http://localhost:8000
          GOVERNEDMEMORY_API_KEY: ci-placeholder-key
        run: npm run build

  package-smoke:
    name: Clean SDK source install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install from a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sdk-venv/bin/python" -m pip install ./sdk/python
      - name: Import the installed client
        run: |
          "$RUNNER_TEMP/sdk-venv/bin/python" -c "from metaworkers import GovernedMemory, Source; print(GovernedMemory, Source)"
