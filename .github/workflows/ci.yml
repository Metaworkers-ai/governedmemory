name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pip install -e sdk/python
      - name: ruff check
        run: ruff check core/ api/ tests/ sdk/python/
      - name: ruff format --check
        run: ruff format --check core/ api/ tests/ sdk/python/

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pip install -e sdk/python
      - name: pytest tests/unit
        run: pytest tests/unit/ -v --cov=core --cov=api --cov=metaworkers --cov-report=term-missing

  test-integration:
    name: Integration tests (Postgres + pgvector via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r requirements-api.txt
          pip install -e .
          pip install -e sdk/python
      - name: pytest tests/integration
        run: pytest tests/integration/ -v --cov=core --cov=api --cov=metaworkers --cov-report=term-missing

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: next build
        env:
          GOVERNEDMEMORY_API_URL: http://localhost:8000
          GOVERNEDMEMORY_API_KEY: ci-placeholder-key
        run: npm run build
