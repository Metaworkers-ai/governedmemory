name: Publish Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require tag to match package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("sdk/python/pyproject.toml").open("rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          expected_tag="v${package_version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Refusing to publish: ${RELEASE_TAG} does not match ${expected_tag}."
            exit 1
          fi

  build:
    name: Build metaworkers distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build wheel and source distribution
        working-directory: sdk/python
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: metaworkers-dist
          path: sdk/python/dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/metaworkers
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metaworkers-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-package-channel:
    name: Verify PyPI installation
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the published package from PyPI
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          package="metaworkers==${PACKAGE_VERSION}"
          for attempt in $(seq 1 12); do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple "$package"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "PyPI did not expose $package after publication."
              exit 1
            fi
            sleep 10
          done
      - name: Import the published package
        run: python -c "from metaworkers import GovernedMemory, Source; print(GovernedMemory, Source)"
