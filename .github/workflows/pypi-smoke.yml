name: Published PyPI availability

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  published-package:
    name: Import the published SDK (not branch validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the published package
        run: |
          python -m venv "$RUNNER_TEMP/pypi-venv"
          "$RUNNER_TEMP/pypi-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pypi-venv/bin/python" -m pip install --no-cache-dir metaworkers==0.1.0
      - name: Import the published client
        run: |
          "$RUNNER_TEMP/pypi-venv/bin/python" -c "from metaworkers import GovernedMemory, Source; print(GovernedMemory, Source)"
