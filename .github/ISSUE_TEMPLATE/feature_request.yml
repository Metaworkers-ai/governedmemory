name: Feature request
description: Suggest an improvement to GovernedMemory
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user or operator problem first. Do not include private customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
